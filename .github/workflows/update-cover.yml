name: Update Random Cover

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick random unique file
        id: random
        run: |
          files=($(find Covers -type f \( -iname "*.jpg" -o -iname "*.png" -o -iname "*.gif" \)))
          touch .used_covers
          used=($(cat .used_covers))
          available=()
          for f in "${files[@]}"; do
            if [[ ! " ${used[*]} " =~ " ${f} " ]]; then
              available+=("$f")
            fi
          done
          if [ ${#available[@]} -eq 0 ]; then
            > .used_covers
            available=("${files[@]}")
          fi
          random_file=${available[$RANDOM % ${#available[@]}]}
          echo "${used[@]} $random_file" | tr ' ' '\n' > .used_covers
          echo "file=$random_file" >> $GITHUB_OUTPUT

      - name: Update README
        run: |
          sed -i "s|^!\[MasterHead\](.*)|![MasterHead](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${{ steps.random.outputs.file }})|" README.md

      - name: Commit and Push Safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Purane kisi bhi uncommitted change ko saaf karo
          git reset --hard
          
          # 2. Latest changes pull karo
          git pull origin main --rebase
          
          # 3. Fir se README update karo (kyunki reset ne purana change mita diya hoga)
          sed -i "s|^!\[MasterHead\](.*)|![MasterHead](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${{ steps.random.outputs.file }})|" README.md
          
          # 4. Ab safely commit aur push karo
          git add README.md .used_covers
          git commit -m "chore: update random cover [skip ci]" || echo "No changes to commit"
          git push origin main
