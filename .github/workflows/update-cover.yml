name: Update Random Cover

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:       

permissions:
  contents: write

jobs:
  update-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick random unique file
        id: random
        run: |
          files=($(find Covers -type f \( -iname "*.jpg" -o -iname "*.png" -o -iname "*.gif" \)))
          touch .used_covers
          used=($(cat .used_covers))
          available=()
          for f in "${files[@]}"; do
            if [[ ! " ${used[*]} " =~ " ${f} " ]]; then
              available+=("$f")
            fi
          done
          if [ ${#available[@]} -eq 0 ]; then
            > .used_covers
            available=("${files[@]}")
          fi
          random_file=${available[$RANDOM % ${#available[@]}]}
          echo "${used[@]} $random_file" | tr ' ' '\n' > .used_covers
          echo "file=$random_file" >> $GITHUB_OUTPUT

      - name: Update README Cover
        run: |
          python3 -c "
          import re, os
          repo = os.environ['GITHUB_REPOSITORY']
          file_path = os.environ['FILE_PATH']
          new_url = f'https://raw.githubusercontent.com/{repo}/main/{file_path}'
          
          with open('README.md', 'r', encoding='utf-8') as f:
              text = f.read()
              
          # Yeh sirf us line ko replace karega jisme Cover image hai, baki README safe rahega
          text = re.sub(r'\[?!\[Cover\].*', f'![Cover]({new_url})', text)
          
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(text)
          "
        env:
          FILE_PATH: ${{ steps.random.outputs.file }}

      - name: Commit and Push Safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md .used_covers
          git commit -m "chore: update random cover [skip ci]" || echo "No changes to commit"
          git push origin main
