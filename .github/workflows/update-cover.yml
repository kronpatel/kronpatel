name: Update Random Cover

on:
  schedule:
    - cron: "*/5 * * * *"   # Har 5 minute me chalega
  workflow_dispatch:

# Ye permission bohot zaroori hai push karne ke liye!
permissions:
  contents: write

jobs:
  update-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Force push aur amend ke liye zaroori

      - name: Pick random unique file
        id: random
        run: |
          # Covers folder se saari images dhoondho
          files=($(find Covers -type f \( -iname "*.jpg" -o -iname "*.png" -o -iname "*.gif" \)))
          
          # Agar .used_covers nahi hai toh banao
          touch .used_covers
          used=($(cat .used_covers))

          available=()
          for f in "${files[@]}"; do
            if [[ ! " ${used[*]} " =~ " ${f} " ]]; then
              available+=("$f")
            fi
          done

          # Agar saari images use ho gayi hain, toh list reset kar do
          if [ ${#available[@]} -eq 0 ]; then
            echo "All files used, resetting used list."
            > .used_covers
            available=("${files[@]}")
          fi

          # Bachi hui images me se random uthao
          random_file=${available[$RANDOM % ${#available[@]}]}

          # Nayi image ko used list me daalo
          echo "${used[@]} $random_file" | tr ' ' '\n' > .used_covers

          echo "file=$random_file" >> $GITHUB_OUTPUT

      - name: Update README
        run: |
          # README me image update karo
          sed -i "s|^!\[MasterHead\](.*)|![MasterHead](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${{ steps.random.outputs.file }})|" README.md

      - name: Commit and Force Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md .used_covers
          
          # Purane commit ko overwrite karega taaki history clean rahe
          git commit -m "chore: update random cover [skip ci]" --amend || true
          git push origin main --force
