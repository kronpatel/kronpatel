name: Update Random Cover

on:
  schedule:
    - cron: "*/5 * * * *"   # Har 5 minute mein chalega
  workflow_dispatch:        # Manual run ke liye

permissions:
  contents: write

jobs:
  update-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick random unique file
        id: random
        run: |
          files=($(find Covers -type f \( -iname "*.jpg" -o -iname "*.png" -o -iname "*.gif" \)))
          touch .used_covers
          used=($(cat .used_covers))
          available=()
          for f in "${files[@]}"; do
            if [[ ! " ${used[*]} " =~ " ${f} " ]]; then
              available+=("$f")
            fi
          done
          if [ ${#available[@]} -eq 0 ]; then
            > .used_covers
            available=("${files[@]}")
          fi
          random_file=${available[$RANDOM % ${#available[@]}]}
          echo "${used[@]} $random_file" | tr ' ' '\n' > .used_covers
          echo "file=$random_file" >> $GITHUB_OUTPUT

      - name: Update README
        run: |
          # Banner update logic
          sed -i "s|^!\[MasterHead\](.*)|![MasterHead](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${{ steps.random.outputs.file }})|" README.md

      - name: Commit and Push Safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pehle changes ko add/stage karo, fir pull karo (Error solution)
          git add README.md .used_covers
          
          # Pull changes before pushing
          git pull origin main --rebase
          
          # Ab commit aur push karo
          git commit -m "chore: update random cover [skip ci]" || echo "No changes to commit"
          git push origin main
